function cols(items,avg){const mx=Math.max(...items.map(x=>x.v),avg||0,0);if(!items.length||mx<=0)return'<p class="m">لا بيانات بعد</p>';return`<div class="cb"><div class="cbi">${avg>0?`<div class="avg" style="bottom:${avg/mx*100}%"><span>المتوسط ${f(avg)}</span></div>`:''}${items.map(x=>`<div class="cc" title="${x.n}: ${f(x.v)}"><i style="height:${Math.max(2,x.v/mx*100)}%"></i><em>${x.l}</em></div>`).join('')}</div></div>`}
